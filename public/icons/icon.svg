<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101828"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4776F6"/>
      <stop offset="100%" stop-color="#1451D1"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#grad)"/>
  
  <!-- Subtle Border Glow -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#4776F6" stroke-width="6" stroke-opacity="0.3"/>
  
  <!-- Cap / Book Graphic -->
  <g transform="translate(96, 110)">
    <!-- Mortarboard cap -->
    <path d="M160 30 L310 100 L160 170 L10 100 Z" fill="url(#accent)"/>
    <path d="M160 170 L280 120 V190 C280 250 160 290 160 290 C160 290 40 250 40 190 V120 Z" fill="#20B486"/>
    <!-- Tassel -->
    <path d="M280 120 L300 210" stroke="#F5B942" stroke-width="10" stroke-linecap="round"/>
    <circle cx="300" cy="220" r="14" fill="#F5B942"/>
    
    <!-- Open Book / Orbit Pages -->
    <path d="M60 240 Q160 210 160 280 Q160 210 260 240" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
